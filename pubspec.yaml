name: expresso
description: "Express your fellings"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  youtube_explode_dart:
    git:
      url: https://github.com/Hexer10/youtube_explode_dart.git

  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.5.0
  firebase_messaging: ^16.3.0
  http: ^1.6.0
  flutter_local_notifications: ^22.0.0
  audioplayers: ^6.7.1
  minio: ^3.5.8
  image_picker: ^1.2.2
  video_player: ^2.11.1
  flutter_cache_manager: ^3.4.1
  emoji_picker_flutter: ^4.4.0
  file_picker: ^11.0.2
  record: ^6.2.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  wakelock_plus: ^1.5.2
  dio: ^5.9.2
  permission_handler: ^12.0.3
  ffmpeg_kit_flutter_new: ^4.2.1
  device_info_plus: ^12.4.0
  share_plus: ^12.0.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/ic_launcher.png"


flutter_native_splash:
  color: "#ffffff"
  image: assets/images/ic_launcher.png
  android_12:
    image: assets/images/ic_launcher.png
    color: "#ffffff"